name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  schedule:
    # 每日每小時自動重新抓取報價與歷史並建置（每小時第 17 分，cron 以 UTC 計）
    # 註：避開整點 :00——GitHub 在整點負載最高，排程常被延遲或直接丟棄（實測 20 小時只跑了 3 次）。
    #     即使如此，GitHub 排程仍是「盡力而為」，不保證每小時都會執行。
    - cron: '17 * * * *'
  workflow_dispatch: # 支援在 GitHub Actions 頁面手動點擊執行

# 設定 GITHUB_TOKEN 權限以部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 同一時間只允許一個部署運行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build static website (bake portfolio data into index.html)
        run: |
          python build_static.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上傳包含 index.html 與 debt.json 的根目錄
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
